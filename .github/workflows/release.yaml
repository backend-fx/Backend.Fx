name: release

on:
  workflow_dispatch:
  push:
    tags: 
      - "v*.*.*"

jobs:
  release:
    name: release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: marcwittke

      - name: push
        run: |
          dotnet test \
            --project src/Backend.Fx.Tests/Backend.Fx.Tests.csproj \
            --configuration Release \
            -p:Version="${VERSION#v}" \
            --results-directory artifacts/test-results \
            --report-trx --report-trx-filename Backend.Fx.Tests.trx
          dotnet pack \
            --configuration Release \
            --no-build \
            --output artifacts \
            -p:Version="${VERSION#v}"
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key ${{steps.login.outputs.NUGET_API_KEY}} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env:
          VERSION: ${{ github.ref_name }}
          NUGET_APIKEY: ${{ secrets.NUGET_APIKEY }}
